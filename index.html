<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator Tutorial</title>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <input type="text" placeholder="0" value="0" id="inputBox" disabled>
        </div>

        <div class="row">
            <button class="buttons" class="opr">AC</button>
            <button class="buttons" class="opr">DEL</button>
            <button class="buttons" class="opr">%</button>
            <button class="buttons" class="opr">/</button>
        </div>

        <div class="row">
            <button class="buttons">7</button>
            <button class="buttons">8</button>
            <button class="buttons">9</button>
            <button class="buttons" class="opr">*</button>
        </div>

        <div class="row">
            <button class="buttons">4</button>
            <button class="buttons">5</button>
            <button class="buttons">6</button>
            <button class="buttons" class="opr">-</button>
        </div>

        <div class="row">
            <button class="buttons">1</button>
            <button class="buttons">2</button>
            <button class="buttons">3</button>
            <button class="buttons" class="opr">+</button>
        </div>

        <div class="row">
            <button class="buttons">00</button>
            <button class="buttons">0</button>
            <button class="buttons">.</button>
            <button class="buttons" id="eqBtn">=</button>
        </div>

    </div>
    
</body>
</html>
